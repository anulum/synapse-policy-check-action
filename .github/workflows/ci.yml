# SYNAPSE policy check — the Action's own tests and a self-run on each runner OS
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
        env:
          GH_TOKEN: ${{ github.token }}

  self-run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: A passing receipt passes with the attestation verified
        id: pass
        uses: ./
        with:
          task: T1
          policy: tests/fixtures/policy.json
          receipt-json: tests/fixtures/receipt-pass.json
          verify-attestation: "true"
          python-version: ${{ matrix.python-version }}

      - name: A failing receipt gates the job
        id: fail
        continue-on-error: true
        uses: ./
        with:
          task: T1
          policy: tests/fixtures/policy.json
          receipt-json: tests/fixtures/receipt-fail.json
          python-version: ${{ matrix.python-version }}

      - name: Check both outcomes and reports
        shell: bash
        env:
          PASS_REPORT: ${{ steps.pass.outputs.report }}
          FAIL_OUTCOME: ${{ steps.fail.outcome }}
          FAIL_REPORT: ${{ steps.fail.outputs.report }}
        run: |
          set -euo pipefail
          test "$FAIL_OUTCOME" = failure
          printf '%s' "$PASS_REPORT" | grep -q '"overall": "pass"'
          printf '%s' "$FAIL_REPORT" | grep -q '"overall": "fail"'
